name: mc_get
description: A modrinth cli for managing minecraft mods from modrinth over the command line. You can search for projects and download mods.
version: 0.0.1
repository: https://github.com/NBSgamesAT/mc-get

environment:
  sdk: ^3.11.5

# Add regular dependencies here.
dependencies:
